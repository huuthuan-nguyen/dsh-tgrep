- insert:
    - id: tgrep
      name: dsh-tgrep
      config:
        enabled: true
        # Prefer the running tgrep server when available; fall back to one-shot
        preferServer: true
        # Soft limit on returned lines (model context protection)
        maxLines: 300
        # Extra CLI flags passed to every tgrep invocation (array of strings)
        extraArgs: []
        # tgrep skips files above 64 MiB by default, where grep/ripgrep search
        # them; this plugin passes --no-max-filesize so shadowing grep cannot
        # silently drop matches. Set a size here to cap instead (e.g. "64M",
        # "8M"), trading coverage for scan time on repos with huge files.
        # maxFileSize: "64M"
        # Start a `tgrep serve` daemon for the session workspace when none is
        # running, so no manual `tgrep serve .` is needed per project.
        autoStartDaemon: true
        # How long a search waits for a freshly spawned daemon to bind before
        # proceeding anyway (it scans meanwhile, so the call never fails).
        daemonReadyTimeoutMs: 5000
        # Stop the daemon this plugin started when the harness exits, so it does
        # not linger as an orphan. Set false to keep it warm across sessions.
        stopDaemonOnExit: true
        # Extra flags for the `tgrep serve` daemon this plugin starts. `extraArgs`
        # above belongs to searches, so this is the only way to configure the
        # daemon itself. Examples:
        #   ["--exclude", "data"]                        skip a directory when indexing
        #   ["--watch-mode", "poll", "--poll-interval", "300"]  cheaper refresh
        #   ["--no-watch"]                               index once, never refresh
        #   ["--max-cpu", "25", "--max-memory", "2048"]  bound build resources
        daemonArgs: []
